# /etc/nginx/sites-available/nihomi.com
# NIHOMI V3 — Production Nginx Configuration (Cloudflare Full SSL & HTTP/2)
# Proxies to local Node.js server running on port 3000

server {
    listen 80;
    listen [::]:80;
    server_name nihomi.com www.nihomi.com;
    
    # Enforce HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nihomi.com www.nihomi.com;

    # SSL Certificates (Cloudflare Origin CA or Let's Encrypt)
    ssl_certificate /etc/ssl/certs/nihomi_origin.pem;
    ssl_certificate_key /etc/ssl/private/nihomi_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client Request Limits
    client_max_body_size 25M;

    # Static Assets Caching
    location /assets/ {
        alias /var/www/nihomi/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Reverse Proxy to Nihomi V3 Express/Node Backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Real Client IP from Cloudflare
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
