
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#DC2626" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112.64" fill="url(#grad)" />
  <rect x="20.48" y="20.48" width="471.04" height="471.04" rx="97.28" fill="none" stroke="#27272A" stroke-width="10.24" />
  
  <!-- Tokyo Sun / Circle Accent -->
  <circle cx="256" cy="225.28" r="143.36" fill="url(#redGrad)" filter="url(#glow)" />
  
  <!-- Japanese Kanji / Text -->
  <text x="256" y="266.24" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="163.84" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">日</text>
  
  <!-- Nihomi Subtitle -->
  <text x="256" y="430.08" font-family="'Inter', system-ui, sans-serif" font-size="46.08" font-weight="800" letter-spacing="10.24" fill="#E4E4E7" text-anchor="middle">NIHOMI</text>
</svg>
