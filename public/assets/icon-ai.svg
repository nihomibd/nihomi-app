  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42.24" fill="url(#grad)" />
  <rect x="7.68" y="7.68" width="176.64000000000001" height="176.64000000000001" rx="36.480000000000004" fill="none" stroke="#27272A" stroke-width="3.84" />
  
