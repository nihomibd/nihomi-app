
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#DC2626" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="14.08" fill="url(#grad)" />
  <rect x="2.56" y="2.56" width="58.88" height="58.88" rx="12.16" fill="none" stroke="#27272A" stroke-width="1.28" />
  
  <!-- Tokyo Sun / Circle Accent -->
  <circle cx="32" cy="28.16" r="17.92" fill="url(#redGrad)" filter="url(#glow)" />
  
  <!-- Japanese Kanji / Text -->
  <text x="32" y="33.28" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="20.48" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">日</text>
  
  <!-- Nihomi Subtitle -->
  <text x="32" y="53.76" font-family="'Inter', system-ui, sans-serif" font-size="5.76" font-weight="800" letter-spacing="1.28" fill="#E4E4E7" text-anchor="middle"></text>
</svg>
